[package]
name = "lk"
version = "0.1.1"
authors = ["Ricky (Degausser) <Ricky@Hosfe.lt>"]
edition = "2024"
keywords = ["cli", "tool", "tooling", "unix", "terminal", "watch", "productivity"]
description = "Simple program to run commands and get notified when they finish"
homepage = "https://github.com/deg4uss3r/lk"
repository = "https://github.com/deg4uss3r/lk"
readme = "README.md"
license-file = "LICENSE"

[dependencies]
twrs-sms = "0.1.1"
confy = "2"
serde = {version = "1.0", features = ["derive"]}
serde_derive = "1.0"
directories = "6.0"
hostname = "0.4"
lettre = "0.11.19"
mmrs = "0.1.3"
notify-rust = "4.11"
